{{- if and .Values.rbac.create (ne .Values.proxy.inboundAuth "none") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "observability-workspace-proxy.fullname" . }}
  labels:
    {{- include "observability-workspace-proxy.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- if eq .Values.proxy.inboundAuth "rbac" }}
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "observability-workspace-proxy.fullname" . }}
  labels:
    {{- include "observability-workspace-proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "observability-workspace-proxy.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "observability-workspace-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

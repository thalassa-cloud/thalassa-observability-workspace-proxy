apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability-workspace-proxy.fullname" . }}
  labels:
    {{- include "observability-workspace-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "observability-workspace-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability-workspace-proxy.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "observability-workspace-proxy.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "observability-workspace-proxy.args" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ regexReplaceAll ".*:(\\d+)$" .Values.proxy.listenAddress "${1}" | int }}
              protocol: TCP
            - name: metrics
              containerPort: {{ regexReplaceAll ".*:(\\d+)$" .Values.proxy.metricsAddress "${1}" | int }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: thalassa-token
              mountPath: {{ dir .Values.projectedToken.path }}
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/proxy/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: thalassa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: {{ base .Values.projectedToken.path }}
                  audience: {{ .Values.projectedToken.audience | quote }}
                  expirationSeconds: {{ .Values.projectedToken.expirationSeconds }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "tls.secretName is required when tls.enabled" .Values.tls.secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Download Syft
        uses: anchore/sbom-action/download-syft@v0.24.3
      - name: Download Cosign
        uses: sigstore/cosign-installer@v4.1.3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Publish Helm charts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for chart in chart/*/; do
            if [ -f "${chart}Chart.yaml" ]; then
              CHART_NAME=$(basename "${chart}")
              echo "Packaging chart: ${CHART_NAME}"
              helm package "${chart}" --version "${VERSION}" --app-version "${VERSION}"

              echo "Pushing chart: ${CHART_NAME}-${VERSION}.tgz"
              PUSH_OUTPUT=$(helm push "${CHART_NAME}-${VERSION}.tgz" oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts 2>&1)
              echo "${PUSH_OUTPUT}"

              DIGEST=$(echo "${PUSH_OUTPUT}" | grep "Digest:" | awk '{print $2}')

              if [ -n "${DIGEST}" ]; then
                echo "Signing chart with digest: ${DIGEST}"
                cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/${CHART_NAME}@${DIGEST}"
              else
                echo "Warning: Could not extract digest, signing with tag"
                cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/${CHART_NAME}:${VERSION}"
              fi
            fi
          done
